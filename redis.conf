# ──────────────────────────────────────────────────────────────────────────────
# Hardened Redis configuration for OpenFin
#
# This file is mounted read-only into the Redis container by compose.prod.yaml.
# Secrets (requirepass) are injected via the compose `command:` override so
# they never live in a committed file.
#
# Sections:
#   1. Authentication
#   2. Network / binding
#   3. TLS (disabled by default — see instructions below to enable)
#   4. Security hardening
#   5. Persistence
#   6. Operational / logging
#   7. Memory
# ──────────────────────────────────────────────────────────────────────────────


# ── 1. Authentication ─────────────────────────────────────────────────────────

# Prefer an ACL file for granular per-user permissions and auditability.
# When aclfile is set, requirepass is ignored.
# Generate with: redis-cli ACL GENPASS for each user entry.
# aclfile /etc/redis/users.acl

# Fallback inline password — used when no aclfile is present.
# This line is intentionally left unset; the password is injected at runtime
# via the compose `command:` flag (--requirepass ${REDIS_PASSWORD}) so that no
# credential is ever stored in a committed config file.
# requirepass <set-via-compose-command>


# ── 2. Network / binding ──────────────────────────────────────────────────────

# Docker deployments: Redis is isolated to the internal Docker network
# (no `ports:` in compose.prod.yaml) so binding to all interfaces is safe.
# Combined with requirepass this is functionally equivalent to IP restriction.
#
# Bare-metal / VM deployments: restrict to the loopback + app-server IP:
#   bind 127.0.0.1 <app-server-ip>
bind 0.0.0.0 -::1

# Protected mode requires authentication whenever Redis is reachable from a
# non-loopback address. Keep enabled — it is the last line of defence if
# requirepass is accidentally unset.
protected-mode yes


# ── 3. TLS ────────────────────────────────────────────────────────────────────
#
# How to enable:
#   1. Generate certs:
#        openssl req -x509 -nodes -newkey rsa:4096 -days 730 \
#          -keyout redis.key -out redis.crt -subj "/CN=redis"
#   2. Place redis.crt, redis.key (and optionally ca.crt) in ./tls/
#   3. Mount ./tls into the container (add to compose.prod.yaml volumes):
#        - ./tls:/etc/redis/tls:ro
#   4. Uncomment the block below.
#   5. Update REDIS_URL in the app to: rediss://:<password>@redis:6380

# tls-port 6380
# port 0
# tls-cert-file     /etc/redis/tls/redis.crt
# tls-key-file      /etc/redis/tls/redis.key
# tls-ca-cert-file  /etc/redis/tls/ca.crt
# tls-auth-clients  no
# tls-protocols     "TLSv1.2 TLSv1.3"
# tls-ciphers       "TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-RSA-AES256-GCM-SHA384"
# tls-prefer-server-ciphers yes
# tls-replication   yes
# tls-cluster       yes


# ── 4. Security hardening ─────────────────────────────────────────────────────

# Disable the DEBUG command (exposes memory layout, can crash the server,
# and allows arbitrary configuration reads in older builds).
enable-debug-command no

# Prevent CONFIG SET from changing security-sensitive settings at runtime
# (e.g. requirepass, bind, tls-*). Immutability reduces the blast radius of
# a compromised client.
enable-protected-configs yes

# Disable dynamic module loading. Modules execute native code with full Redis
# privileges and are rarely needed in a pure-cache role.
enable-module-command no

# Idle-connection timeout (seconds). Closes connections that have been silent
# for this long, preventing leak accumulation in long-lived deployments.
# 300 s is safe for all of OpenFin's TTL patterns (min TTL is 30 s).
timeout 300

# TCP keepalive: send ACK probes every N seconds to detect dead peers at the
# OS level without waiting for timeout to expire.
tcp-keepalive 60


# ── 5. Persistence ────────────────────────────────────────────────────────────

# Append-only file — safer than RDB snapshots on crash; fsync every second
# gives at most 1 s of data loss while keeping write throughput high.
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb


# ── 6. Operational / logging ──────────────────────────────────────────────────

# Log level: debug → verbose → notice → warning.
# "notice" logs server lifecycle events and unusual conditions without noise.
loglevel notice

# Write logs to a file so they survive container restarts and are accessible
# via the mounted /var/log/redis volume.
# Set to "" to fall back to stdout (useful in local dev).
logfile /var/log/redis/redis-server.log

# Slow-log: record commands slower than this threshold (microseconds).
# 10 ms is a sensible starting point for a cache workload.
slowlog-log-slower-than 10000
slowlog-max-len 128


# ── 7. Memory ─────────────────────────────────────────────────────────────────

# Cap memory usage and evict the least-recently-used keys when the limit is hit.
# The compose deploy.resources.limits.memory already sets a hard container cap;
# this Redis-level limit should be set slightly below that value.
# Uncomment and adjust to match your deployment.
# maxmemory 200mb
# maxmemory-policy allkeys-lru
