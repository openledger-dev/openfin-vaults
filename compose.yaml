# Docker Compose for local testing of the production image + Redis
#
# Usage:
#   1. Copy .env.local.example to .env.compose and fill in your values.
#   2. docker compose up --build
#   3. Open http://localhost:3032
#
# The app is rebuilt from scratch on every `--build`. Omit --build to reuse
# the last built image (faster iteration when only runtime vars change).

services:
  redis:
    image: redis:7-alpine
    # Dev: no password, but disable DEBUG and module commands to match prod behaviour.
    # Do not mount redis.conf here — its `protected-mode yes` + `bind 0.0.0.0`
    # combination requires a password, which we intentionally skip in dev.
    command: >
      redis-server
      --loglevel notice
      --timeout 300
      --tcp-keepalive 60
      --enable-debug-command no
      --enable-protected-configs yes
      --enable-module-command no
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    cap_drop:
      - NET_ADMIN
      - SYS_ADMIN
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
          pids: 100
    logging:
      driver: json-file
      options:
        max-size: "200m"
        max-file: "10"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # ── Build-time vars (baked into the client JS bundle) ──────────────────
        # All values are read automatically from --env-file .env.compose
        NEXT_PUBLIC_REOWN_PROJECT_ID:      ${NEXT_PUBLIC_REOWN_PROJECT_ID}
        NEXT_PUBLIC_ULTRAYIELD_VAULT_ADDR: ${NEXT_PUBLIC_ULTRAYIELD_VAULT_ADDR:-}
        NEXT_PUBLIC_ULTRAYIELD_CHAIN_ID:   ${NEXT_PUBLIC_ULTRAYIELD_CHAIN_ID:-1}
        NEXT_PUBLIC_MORPHO_VAULT_ADDR:     ${NEXT_PUBLIC_MORPHO_VAULT_ADDR:-}
        NEXT_PUBLIC_MIDAS_VAULT_ADDR:      ${NEXT_PUBLIC_MIDAS_VAULT_ADDR:-}
        NEXT_PUBLIC_MIDAS_CHAIN_ID:        ${NEXT_PUBLIC_MIDAS_CHAIN_ID:-1}
        NEXT_PUBLIC_SWAP_MIN_USD:          ${NEXT_PUBLIC_SWAP_MIN_USD:-5}
        NEXT_PUBLIC_APP_URL:               ${NEXT_PUBLIC_APP_URL:-http://localhost:3032}
        SHOW_ALLOCATION:                   ${SHOW_ALLOCATION:-false}P
    # Tag the image for Docker Hub so `docker compose push` works
    image: openledgerhub/openfin-vault:${APP_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "3032:3032"
    environment:
      # ── Runtime vars (server-side only, not baked into the bundle) ──────────
      # Redis: point to the compose service, not localhost
      REDIS_URL: redis://redis:6379

      # RPC endpoints — override via .env.compose or shell env
      RPC_URL_1:     ${RPC_URL_1:-}
      RPC_URL_8453:  ${RPC_URL_8453:-}

      # Optional API keys
      ONEINCH_API_KEY:     ${ONEINCH_API_KEY:-}
      ONECLICK_JWT_TOKEN:  ${ONECLICK_JWT_TOKEN:-}

      # Rate limiting (set to "true" to enable)
      RATE_LIMIT_ENABLED:  ${RATE_LIMIT_ENABLED:-false}

      # Cache TTL overrides (all optional)
      REDIS_TTL_META:    ${REDIS_TTL_META:-3600}
      REDIS_TTL_STATE:   ${REDIS_TTL_STATE:-30}
      REDIS_TTL_APY:     ${REDIS_TTL_APY:-300}
      REDIS_TTL_APY_7D:  ${REDIS_TTL_APY_7D:-86400}
      REDIS_TTL_PRICE:   ${REDIS_TTL_PRICE:-600}
      REDIS_TTL_PENDING: ${REDIS_TTL_PENDING:-60}

      # Allocation panels (UltraYield + Morpho) — also set at build via SHOW_ALLOCATION
      SHOW_ALLOCATION:   ${SHOW_ALLOCATION:-false}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3032/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
          pids: 200
    logging:
      driver: json-file
      options:
        max-size: "200m"
        max-file: "10"

volumes:
  redis_data:
